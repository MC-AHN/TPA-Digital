<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Setoran Santri</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen">

  <!-- Header & Navigasi -->
  <header class="mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-emerald-700">Riwayat Setoran</h1>
      <p class="text-xs text-slate-500">Buku Saku Digital Santri</p>
    </div>
    <a href="/"
      class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-3 py-1.5 rounded-lg transition">
      ← Form Setoran
    </a>
  </header>

  <!-- Filter Pilih Santri -->
  <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
    <label for="select-santri" class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri:</label>
    <select id="select-santri" onchange="loadHistory()"
      class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm font-medium">
      <option value="">-- Pilih Nama Santri --</option>
    </select>
  </div>

  <!-- Container History Log -->
  <main id="history-container" class="space-y-3">
    <p class="text-center text-slate-400 py-8 text-sm">Pilih santri terlebih dahulu untuk melihat data.</p>
  </main>

  <script>
    // Fetch Daftar Santri untuk Dropdown
    async function initSantriDropdown() {
      try {
        const res = await fetch('/api/santri');
        const { data } = await res.json();

        const select = document.getElementById('select-santri');
        data.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.nama} (${s.kategori})`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Gagal mengambil daftar santri:', err);
      }
    }

    // Fetch Histori Mutaba'ah Berdasarkan Santri ID
    async function loadHistory() {
      const santriId = document.getElementById('select-santri').value;
      const container = document.getElementById('history-container');

      if (!santriId) {
        container.innerHTML = '<p class="text-center text-slate-400 py-8 text-sm">Pilih santri terlebih dahulu untuk melihat data.</p>';
        return;
      }

      container.innerHTML = '<p class="text-center text-slate-400 py-8 text-sm">Memuat riwayat...</p>';

      try {
        const res = await fetch(`/api/santri/${santriId}/history`);
        const { data } = await res.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-center text-slate-400 py-8 text-sm">Belum ada riwayat setoran.</p>';
          return;
        }

        container.innerHTML = '';
        data.reverse().forEach(log => {
          container.appendChild(createHistoryCard(log));
        });
      } catch (err) {
        container.innerHTML = '<p class="text-center text-red-500 py-8 text-sm">Gagal memuat data histori.</p>';
      }
    }

    // Template Card Log Histori
    function createHistoryCard(log) {
      const card = document.createElement('div');
      card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-sm space-y-2';

      // Badge Warna Status Presensi
      let statusBadge = '';
      switch (log.statusAbsen) {
        case 'hadir':
          statusBadge = '<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-md font-semibold">Hadir</span>';
          break;
        case 'izin':
          statusBadge = '<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-md font-semibold">Izin</span>';
          break;
        case 'sakit':
          statusBadge = '<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-md font-semibold">Sakit</span>';
          break;
        default: // alpa
          statusBadge = '<span class="bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-md font-semibold">Alpa</span>';
          break;
      }

      // Format Tanggal
      const tgl = new Date(log.tanggal).toLocaleDateString('id-ID', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });

      // Body Kartu (Kondisional: Hadir vs Non-Hadir)
      let contentHtml = '';
      if (log.statusAbsen === 'hadir') {
        contentHtml = `
      <div class="flex justify-between items-center pt-1">
        <span class="font-bold text-slate-800">
          ${log.tipeBacaan === 'iqra' ? 'Iqra' : 'Al-Qur\'an'}: ${log.capaian || '-'}
        </span>
        <span class="text-xs text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md border font-medium">
          ${log.catatan || 'Lancar'}
        </span>
      </div>
    `;
      } else {
        contentHtml = `
      <div class="pt-1 text-xs text-slate-600 italic">
        ${log.catatanAbsen ? `Keterangan: "${log.catatanAbsen}"` : 'Tidak ada keterangan.'}
      </div>
    `;
      }

      card.innerHTML = `
    <div class="flex justify-between items-center border-b pb-2">
      <span class="text-xs font-semibold text-slate-500">${tgl}</span>
      ${statusBadge}
    </div>
    ${contentHtml}
  `;

      return card;
    }

    initSantriDropdown();
  </script>
</body>

</html>
