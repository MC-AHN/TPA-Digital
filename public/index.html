<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPA Mutaba'ah - Buku Saku Santri</title>

  <!-- Favicon Ikon Tab Browser (Buku Saku Mutaba'ah) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/><path d='m9 10 2 2 4-4' stroke-width='2.5' stroke='%23059669'/></svg>">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <!-- Script Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen pb-12 font-sans">

  <!-- Header Mobile dengan Logo Baru -->
  <header class="mb-4 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center shadow-md shadow-emerald-600/20 text-white shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          <path d="m9 10 2 2 4-4" stroke-width="2.5" class="stroke-emerald-200" />
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-800 leading-tight">TPA Mutaba'ah</h1>
        <p class="text-[11px] text-slate-500 font-medium">Buku Saku & Presensi Santri</p>
      </div>
    </div>
    <a href="/login.html"
      class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-2 rounded-xl flex items-center gap-1 shadow-sm transition">
      🔑 Login
    </a>
  </header>

  <!-- Filter Pilih Santri -->
  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-4 space-y-3">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri</label>
      <select id="select-santri" onchange="loadHistory()"
        class="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
        <option value="">-- Pilih Nama Santri --</option>
      </select>
    </div>
  </div>

  <!-- Container List Riwayat (Tampilan Lembaran Buku) -->
  <div id="history-container" class="space-y-3">
    <div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-xs text-slate-400">
      Pilih nama santri di atas untuk melihat riwayat.
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    // Listener Realtime Update via SSE
    const eventSource = new EventSource('/api/realtime');

    eventSource.addEventListener('mutabaah-update', (event) => {
      const payload = JSON.parse(event.data);
      const currentSantriId = document.getElementById('select-santri').value;

      // Jika data baru/ubah/hapus milik santri yang sedang dipilih
      if (currentSantriId && Number(currentSantriId) === Number(payload.santriId)) {
        loadHistory();
      }
    });

    async function loadSantriList() {
      try {
        const res = await fetch('/api/admin/santri');
        const { data } = await res.json();
        const select = document.getElementById('select-santri');
        select.innerHTML = '<option value="">-- Pilih Nama Santri --</option>';
        if (data && data.length > 0) {
          data.forEach(s => {
            select.innerHTML += `<option value="${s.id}">${s.nama} (${s.namaHalaqah || 'Tanpa Halaqah'})</option>`;
          });
        }
      } catch (err) {
        console.error("Gagal memuat list santri", err);
      }
    }

    async function loadHistory() {
      const santriId = document.getElementById('select-santri').value;
      const container = document.getElementById('history-container');
      if (!santriId) {
        container.innerHTML = '<div class="bg-white p-6 rounded-2xl border text-center text-xs text-slate-400">Pilih nama santri di atas untuk melihat riwayat.</div>';
        return;
      }

      container.innerHTML = '<p class="text-center text-xs py-4 text-slate-500">Memuat data...</p>';

      try {
        const res = await fetch(`/api/santri/${santriId}`);
        const result = await res.json();
        const data = result.history || result.data || [];

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="bg-white p-4 rounded-2xl border border-slate-200 text-center text-xs text-slate-400">Belum ada catatan mutaba\'ah.</div>';
          return;
        }

        container.innerHTML = '';
        data.forEach(item => {
          const dateStr = item.tanggal ? new Date(item.tanggal).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }) : '-';
          const status = item.statusAbsen || item.status || 'hadir';

          // Tentukan teks capaian
          const teksCapaian = item.capaian
            ? `${(item.tipeBacaan || '').toUpperCase()} - ${item.capaian}`
            : '-';

          // Tentukan teks catatan / alasan
          const teksCatatan = item.catatan || item.catatanAbsen || item.evaluasi || '-';

          // Warna badge & jilid berdasarkan status
          let badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';
          let jilidColor = 'bg-emerald-600';

          if (status === 'izin') {
            badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
            jilidColor = 'bg-amber-500';
          } else if (status === 'sakit') {
            badgeColor = 'bg-blue-50 text-blue-700 border-blue-200';
            jilidColor = 'bg-blue-500';
          } else if (status === 'alpa') {
            badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';
            jilidColor = 'bg-rose-500';
          }

          container.innerHTML += `
            <div class="relative bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden pl-4 pr-4 pt-3.5 pb-4">
              <!-- Garis Jilid Buku Berwarna Sesuai Status -->
              <div class="absolute left-0 top-0 bottom-0 w-2.5 ${jilidColor}"></div>

              <!-- Header Lembaran -->
              <div class="flex justify-between items-center border-b border-dashed border-slate-200 pb-2.5 mb-2.5">
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px]">📅</span>
                  <span class="text-xs font-bold text-slate-700">${dateStr}</span>
                </div>
                <span class="px-2.5 py-0.5 text-[10px] rounded-md font-bold uppercase tracking-wider border ${badgeColor}">
                  ${status}
                </span>
              </div>

              <!-- Isi Catatan Mutaba'ah -->
              <div class="space-y-1.5 text-xs text-slate-600">
                <div class="flex items-start gap-2">
                  <span class="font-bold text-slate-800 min-w-[65px]">📖 Capaian</span>
                  <span class="text-slate-700 font-medium">: ${teksCapaian}</span>
                </div>
                <div class="flex items-start gap-2 pt-1 border-t border-slate-100">
                  <span class="font-bold text-slate-800 min-w-[65px]">📝 Catatan</span>
                  <span class="text-slate-600 italic">: "${teksCatatan}"</span>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = '<div class="bg-white p-4 rounded-2xl border text-center text-xs text-rose-500">Gagal mengambil data riwayat.</div>';
      }
    }

    loadSantriList();
  </script>
</body>

</html>
