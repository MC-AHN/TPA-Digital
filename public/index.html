<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Ustadz - TPA Mutaba'ah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 max-w-md mx-auto min-h-screen">

  <!-- Header & Navigasi -->
  <header class="mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-emerald-700">TPA Mutaba'ah</h1>
      <p class="text-xs text-slate-500" id="current-date"></p>
    </div>
    <div class="flex items-center gap-1.5">
      <a href="/history.html" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-medium px-2.5 py-1.5 rounded-lg transition">
        Riwayat
      </a>
      <button onclick="logout()" class="text-xs bg-rose-100 hover:bg-rose-200 text-rose-700 font-medium px-2.5 py-1.5 rounded-lg transition">
        Logout
      </button>
    </div>
  </header>

  <!-- Container Pilih Halaqah -->
  <section class="mb-6">
    <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Pilih Halaqah Hari Ini</h2>
    <div id="halaqah-list" class="grid grid-cols-1 gap-2">
      <p class="text-xs text-slate-400">Memuat daftar halaqah...</p>
    </div>
  </section>

  <!-- Container List Santri (Tampil Setelah Halaqah Dipilih) -->
  <section id="santri-section" class="hidden space-y-4">
    <div class="flex justify-between items-center border-b pb-2">
      <h2 id="active-halaqah-title" class="text-sm font-bold text-slate-700">Daftar Santri</h2>
      <span id="active-halaqah-badge" class="text-[10px] px-2 py-0.5 rounded font-medium"></span>
    </div>
    <div id="santri-list" class="space-y-4">
      <p class="text-center text-slate-400 py-4 text-xs">Pilih halaqah terlebih dahulu.</p>
    </div>
  </section>

<script>
  // Set Tanggal Hari Ini
  document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');

  // Cek Auth & Auto-redirect Admin ke /admin.html
  if (!token) {
    window.location.href = '/login.html';
  } else if (user.role === 'admin') {
    window.location.href = '/admin.html';
  }

  const currentUstadzId = user.id;
  let currentHalaqahId = null;

  function logout() {
    localStorage.clear();
    window.location.href = '/login.html';
  }

  // 1. Fetch & Render Daftar Halaqah (Menggunakan ID Ustadz yang sedang Login)
  async function fetchHalaqah() {
    try {
      const res = await fetch(`/api/halaqah?ustadzId=${currentUstadzId || ''}`);
      const { data } = await res.json();

      const container = document.getElementById('halaqah-list');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400">Tidak ada halaqah yang tersedia hari ini.</p>';
        return;
      }

      data.forEach(h => {
        const btn = document.createElement('button');
        btn.onclick = () => selectHalaqah(h.id, h.namaHalaqah, h.isBadal);
        btn.className = `w-full text-left p-3 rounded-xl border transition flex justify-between items-center ${
          h.isBadal 
            ? 'bg-amber-50 border-amber-200 hover:bg-amber-100' 
            : 'bg-white border-slate-200 hover:border-emerald-500'
        }`;

        btn.innerHTML = `
          <div>
            <p class="font-bold text-sm text-slate-800">${h.namaHalaqah}</p>
            <p class="text-[11px] text-slate-500">${h.isBadal ? 'Ustadz PJ sedang izin (Halaqah Pengganti)' : 'Halaqah Utama Anda'}</p>
          </div>
          ${h.isBadal ? '<span class="bg-amber-200 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold">BADAL</span>' : ''}
        `;
        container.appendChild(btn);
      });

      // Auto select halaqah pertama
      if (data.length > 0) {
        selectHalaqah(data[0].id, data[0].namaHalaqah, data[0].isBadal);
      }
    } catch (err) {
      console.error('Gagal mengambil halaqah:', err);
    }
  }

  // 2. Pilih Halaqah & Load Santri
  async function selectHalaqah(halaqahId, namaHalaqah, isBadal) {
    currentHalaqahId = halaqahId;
    
    const section = document.getElementById('santri-section');
    const title = document.getElementById('active-halaqah-title');
    const badge = document.getElementById('active-halaqah-badge');
    const container = document.getElementById('santri-list');

    section.classList.remove('hidden');
    title.innerText = namaHalaqah;
    
    if (isBadal) {
      badge.innerText = 'BADAL';
      badge.className = 'text-[10px] px-2 py-0.5 rounded font-medium bg-amber-100 text-amber-800';
    } else {
      badge.innerText = 'UTAMA';
      badge.className = 'text-[10px] px-2 py-0.5 rounded font-medium bg-emerald-100 text-emerald-800';
    }

    container.innerHTML = '<p class="text-center text-slate-400 py-4 text-xs">Memuat santri...</p>';

    try {
      const res = await fetch(`/api/halaqah/${halaqahId}/santri`);
      const { data } = await res.json();

      container.innerHTML = '';
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-4 text-xs">Belum ada santri di halaqah ini.</p>';
        return;
      }

      data.forEach(s => {
        container.appendChild(createSantriCard(s));
      });
    } catch (err) {
      console.error('Gagal memuat santri:', err);
    }
  }

  // 3. Render Form Card Santri
  function createSantriCard(santri) {
    const card = document.createElement('div');
    card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3';
    card.innerHTML = `
      <div class="flex justify-between items-center border-b pb-2">
        <span class="font-bold text-slate-800">${santri.nama}</span>
        <span class="text-xs px-2 py-0.5 rounded ${santri.kategori === 'khusus' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'}">${santri.kategori}</span>
      </div>

      <div class="flex gap-2 text-sm">
        <select id="absen-${santri.id}" onchange="toggleFormAbsen(${santri.id})" class="w-full p-2 border rounded-lg bg-slate-50 font-medium">
          <option value="hadir">Hadir</option>
          <option value="izin">Izin</option>
          <option value="sakit">Sakit</option>
          <option value="alpa">Alpa</option>
        </select>
        
        <select id="tipe-${santri.id}" class="w-full p-2 border rounded-lg bg-slate-50">
          <option value="iqra">Iqra</option>
          <option value="quran">Al-Qur'an</option>
        </select>
      </div>

      <div id="form-mengaji-${santri.id}" class="space-y-2">
        <input type="text" id="capaian-${santri.id}" placeholder="Capaian (misal: Jilid 3 Hal 12 / An-Naba: 1-15)" class="w-full p-2 border rounded-lg text-sm">
        <select id="catatan-${santri.id}" class="w-full p-2 border rounded-lg bg-slate-50 text-sm">
          <option value="lancar">Lancar</option>
          <option value="ulangi">Ulangi</option>
          <option value="lanjut_jilid">Lanjut Jilid/Surah</option>
          <option value="kurang_fashih">Kurang Fashih</option>
        </select>
      </div>

      <div id="form-absen-note-${santri.id}" class="hidden">
        <input type="text" id="catatan-absen-${santri.id}" placeholder="Keterangan (opsional, misal: Sakit demam)" class="w-full p-2 border rounded-lg text-sm bg-slate-50">
      </div>

      <button id="btn-submit-${santri.id}" onclick="submitMutabaah(${santri.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">
        Simpan Setoran
      </button>
    `;
    return card;
  }

  function toggleFormAbsen(santriId) {
    const status = document.getElementById(`absen-${santriId}`).value;
    const formMengaji = document.getElementById(`form-mengaji-${santriId}`);
    const tipeBacaan = document.getElementById(`tipe-${santriId}`);
    const formAbsenNote = document.getElementById(`form-absen-note-${santriId}`);

    if (status === 'hadir') {
      formMengaji.classList.remove('hidden');
      tipeBacaan.classList.remove('hidden');
      formAbsenNote.classList.add('hidden');
    } else {
      formMengaji.classList.add('hidden');
      tipeBacaan.classList.add('hidden');
      formAbsenNote.classList.remove('hidden');
    }
  }

  // 4. Submit Mutaba'ah (Mengirim halaqahId dan ustadzId secara dinamis)
  async function submitMutabaah(santriId) {
    const btn = document.getElementById(`btn-submit-${santriId}`);
    const statusAbsenSelect = document.getElementById(`absen-${santriId}`);
    const capaianInput = document.getElementById(`capaian-${santriId}`);
    const tipeBacaanSelect = document.getElementById(`tipe-${santriId}`);
    const catatanSelect = document.getElementById(`catatan-${santriId}`);
    const catatanAbsenInput = document.getElementById(`catatan-absen-${santriId}`);

    const payload = {
      santriId,
      halaqahId: currentHalaqahId,
      ustadzId: currentUstadzId,
      statusAbsen: statusAbsenSelect.value,
      catatanAbsen: catatanAbsenInput.value,
      tipeBacaan: tipeBacaanSelect.value,
      capaian: capaianInput.value,
      catatan: catatanSelect.value,
    };

    btn.disabled = true;
    btn.innerText = 'Menyimpan...';

    try {
      const res = await fetch('/api/mutabaah', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await res.json();
      if (result.success) {
        alert('Data berhasil disimpan!');
        statusAbsenSelect.value = 'hadir';
        capaianInput.value = '';
        catatanAbsenInput.value = '';
        tipeBacaanSelect.value = 'iqra';
        catatanSelect.value = 'lancar';
        toggleFormAbsen(santriId);
      } else {
        alert(`Gagal: ${result.message}`);
      }
    } catch (err) {
      alert('Terjadi kesalahan jaringan.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Simpan Setoran';
    }
  }

  // Panggil fetch halaqah saat halaman dimuat
  fetchHalaqah();
</script>
</body>
</html>
