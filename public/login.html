<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Ustadz - TPA</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/><path d='m9 10 2 2 4-4' stroke-width='2.5' stroke='%23059669'/></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm border border-slate-200">

    <!-- HEADER LOGO BUKU MUTABA'AH -->
    <div class="text-center mb-6">
      <div
        class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-600/20 text-white mx-auto mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
          <!-- Bentuk Buku Saku -->
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          <!-- Centang Mutaba'ah -->
          <path d="m9 10 2 2 4-4" stroke-width="2.5" class="stroke-emerald-200" />
        </svg>
      </div>
      <h1 class="text-xl font-bold text-slate-800">TPA Mutaba'ah</h1>
      <p class="text-xs text-slate-500 mt-0.5">Presensi & Masuk Sistem Ustadz</p>
    </div>

    <div id="error-message"
      class="hidden mb-3 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl font-medium text-center">
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
        <input type="text" id="username" required placeholder="Masukkan username"
          class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:outline-emerald-600">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full p-2.5 border rounded-lg text-sm bg-slate-50 focus:outline-emerald-600">
      </div>

      <!-- Checkbox Presensi Mengajar -->
      <div class="flex items-center gap-2 pt-1">
        <input type="checkbox" id="check-presensi"
          class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
        <label for="check-presensi" class="text-xs font-semibold text-slate-700">
          Catat kehadiran mengajar hari ini
        </label>
      </div>

      <!-- Input Catatan Izin Opsional -->
      <div class="border-t pt-3 mt-3">
        <label class="block text-xs font-semibold text-amber-700 mb-1">Izin Tidak Mengajar? (Opsional)</label>
        <input type="text" id="keteranganIzin" placeholder="Isi alasan jika tidak bisa mengajar"
          class="w-full p-2.5 border border-amber-200 rounded-lg text-sm bg-amber-50/50 focus:outline-amber-600">
      </div>

      <button type="submit" id="btn-submit"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
        Masuk / Presensi
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="/index.html" class="text-xs text-slate-500 hover:text-emerald-600 font-medium">
        ← Kembali ke Halaman Utama
      </a>
    </div>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();

      const errBox = document.getElementById('error-message');
      const btnSubmit = document.getElementById('btn-submit');

      errBox.classList.add('hidden');
      errBox.innerText = '';
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Memproses...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const keteranganIzin = document.getElementById('keteranganIzin')?.value || '';
      const isAbsen = document.getElementById('check-presensi')?.checked || false;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, keteranganIzin, isAbsen })
        });

        const result = await res.json();

        if (!res.ok || !result.success) {
          errBox.innerText = result.message || 'Username atau password salah!';
          errBox.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.innerText = 'Masuk / Presensi';
          return;
        }

        localStorage.setItem('token', result.data.token);
        localStorage.setItem('user', JSON.stringify(result.data.user));

        if (result.data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/ustadz.html';
        }

      } catch (err) {
        errBox.innerText = 'Gagal terhubung ke server. Periksa koneksi internet Anda.';
        errBox.classList.remove('hidden');
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Masuk / Presensi';
      }
    };
  </script>
</body>

</html>
