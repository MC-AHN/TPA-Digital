<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Presensi & Rekap TPA</title>

  <!-- Favicon Ikon Tab Browser (Buku Saku Mutaba'ah) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/><path d='m9 10 2 2 4-4' stroke-width='2.5' stroke='%23059669'/></svg>">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print {
        display: none !important;
      }

      body {
        background: white;
        padding: 0;
      }

      .print-area {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 p-3 sm:p-6 max-w-4xl mx-auto min-h-screen font-sans">

  <!-- Navigasi Header Mobile Friendly dengan Logo Baru -->
  <header
    class="no-print mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center shadow-md shadow-emerald-600/20 text-white shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          <path d="m9 10 2 2 4-4" stroke-width="2.5" class="stroke-emerald-200" />
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight">Rekap Presensi TPA</h1>
        <p class="text-[11px] text-slate-500 font-medium">Laporan Bulanan & Export Data</p>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 w-full sm:w-auto">
      <a href="/admin.html"
        class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-xl border border-slate-200 flex items-center gap-1 transition">←
        Admin</a>
      <button onclick="window.print()"
        class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-2 rounded-xl flex-1 sm:flex-none shadow-sm transition">🖨️
        Cetak / PDF</button>
      <button onclick="exportCSV()"
        class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-2 rounded-xl flex-1 sm:flex-none shadow-sm transition">📊
        Export CSV</button>
    </div>
  </header>

  <!-- Filter Mode & Bulan -->
  <div class="no-print bg-white p-4 rounded-2xl border border-slate-200 mb-4 grid grid-cols-1 sm:grid-cols-3 gap-3 shadow-sm">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Rekap</label>
      <select id="mode-rekap" onchange="toggleFilterMode()"
        class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
        <option value="santri">Presensi Santri Per Halaqah</option>
        <option value="ustadz">Presensi Ustadz</option>
      </select>
    </div>

    <div id="filter-halaqah-container">
      <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Halaqah</label>
      <select id="select-halaqah" onchange="loadRekapData()"
        class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600"></select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Bulan & Tahun</label>
      <input type="month" id="filter-bulan" onchange="loadRekapData()"
        class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
    </div>
  </div>

  <!-- Area Dokumen Cetak -->
  <div class="print-area bg-white p-4 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
    <div class="text-center border-b pb-4 mb-4">
      <h2 class="text-base sm:text-xl font-bold uppercase text-slate-800">BUKU PRESENSI & MUTABA'AH TPA</h2>
      <p class="text-xs text-slate-500 mt-0.5" id="doc-subtitle">Rekap Bulanan</p>
    </div>

    <!-- Wrapper Tabel dengan Overflow Horizontal Mulus -->
    <div class="overflow-x-auto rounded-xl border border-slate-200">
      <table class="w-full text-left text-xs min-w-[550px] border-collapse">
        <thead class="bg-slate-50 text-slate-700 border-b border-slate-200" id="table-head"></thead>
        <tbody id="table-body" class="divide-y divide-slate-200"></tbody>
      </table>
    </div>

    <!-- Area Tanda Tangan Cetak -->
    <div class="mt-8 flex justify-between text-xs px-2 sm:px-6">
      <div class="text-center">
        <p>Mengetahui,</p>
        <p class="font-bold mt-12">Kepala TPA</p>
      </div>
      <div class="text-center">
        <p id="ttd-date">Semarang, ...</p>
        <p class="font-bold mt-12">Pengurus / Ustadz PJ</p>
      </div>
    </div>
  </div>

  <script>
    // Satpam Proteksi Halaman Admin & Rekap
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    if (!token || user.role !== 'admin') {
      alert('Akses ditolak! Halaman ini khusus Admin.');
      window.location.href = '/login.html';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    document.getElementById('filter-bulan').value = new Date().toISOString().slice(0, 7);
    document.getElementById('ttd-date').innerText = `Tanggal: ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;

    let currentData = [];

    async function initHalaqahOptions() {
      try {
        const res = await fetch('/api/admin/halaqah');
        const { data } = await res.json();
        const select = document.getElementById('select-halaqah');
        select.innerHTML = '';
        if (data) {
          data.forEach(h => {
            select.innerHTML += `<option value="${h.id}">${h.namaHalaqah}</option>`;
          });
        }
      } catch (err) {
        console.error("Gagal memuat halaqah", err);
      }
    }

    function toggleFilterMode() {
      const mode = document.getElementById('mode-rekap').value;
      const halaqahContainer = document.getElementById('filter-halaqah-container');
      if (mode === 'santri') {
        halaqahContainer.classList.remove('hidden');
      } else {
        halaqahContainer.classList.add('hidden');
      }
      loadRekapData();
    }

    async function loadRekapData() {
      const mode = document.getElementById('mode-rekap').value;
      const bulan = document.getElementById('filter-bulan').value;
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      const subtitle = document.getElementById('doc-subtitle');

      tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-slate-400">Memuat data...</td></tr>';

      if (mode === 'ustadz') {
        subtitle.innerText = `Rekap Kehadiran Ustadz - Periode: ${bulan}`;
        thead.innerHTML = `
          <tr>
            <th class="p-2.5 text-center w-12">No</th>
            <th class="p-2.5">Nama Ustadz</th>
            <th class="p-2.5 text-center">Hadir</th>
            <th class="p-2.5 text-center">Izin/Sakit</th>
            <th class="p-2.5 text-center">Total Hari</th>
          </tr>`;

        const res = await fetch(`/api/rekap/ustadz?bulan=${bulan}`);
        const result = await res.json();
        currentData = result.data || [];
        tbody.innerHTML = '';

        if (currentData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-slate-400">Belum ada data presensi ustadz.</td></tr>';
          return;
        }

        currentData.forEach((u, i) => {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="p-2.5 text-center">${i + 1}</td>
              <td class="p-2.5 font-bold text-slate-800">${u.username}</td>
              <td class="p-2.5 text-center text-emerald-700 font-bold">${u.hadir}</td>
              <td class="p-2.5 text-center text-amber-700 font-bold">${u.izin}</td>
              <td class="p-2.5 text-center font-medium">${u.totalHari}</td>
            </tr>`;
        });
      } else {
        const halaqahId = document.getElementById('select-halaqah').value;
        const halaqahName = document.getElementById('select-halaqah').options[document.getElementById('select-halaqah').selectedIndex]?.text || '';
        subtitle.innerText = `Rekap Mutaba'ah Santri (${halaqahName}) - Periode: ${bulan}`;

        thead.innerHTML = `
          <tr>
            <th class="p-2.5 text-center w-10">No</th>
            <th class="p-2.5">Nama Santri</th>
            <th class="p-2.5 text-center">Hadir</th>
            <th class="p-2.5 text-center">Izin</th>
            <th class="p-2.5 text-center">Sakit</th>
            <th class="p-2.5 text-center">Alpa</th>
            <th class="p-2.5">Capaian Terakhir</th>
          </tr>`;

        if (!halaqahId) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-slate-400">Pilih halaqah terlebih dahulu.</td></tr>';
          return;
        }

        const res = await fetch(`/api/rekap/santri?halaqahId=${halaqahId}&bulan=${bulan}`);
        const result = await res.json();
        currentData = result.data || [];
        tbody.innerHTML = '';

        if (currentData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-slate-400">Belum ada data santri pada halaqah ini.</td></tr>';
          return;
        }

        currentData.forEach((s, i) => {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="p-2.5 text-center">${i + 1}</td>
              <td class="p-2.5 font-bold text-slate-800">${s.nama}</td>
              <td class="p-2.5 text-center text-emerald-700 font-bold">${s.hadir}</td>
              <td class="p-2.5 text-center text-amber-700">${s.izin}</td>
              <td class="p-2.5 text-center text-blue-700">${s.sakit}</td>
              <td class="p-2.5 text-center text-rose-700 font-bold">${s.alpa}</td>
              <td class="p-2.5 text-slate-600">${s.capaianTerakhir}</td>
            </tr>`;
        });
      }
    }

    function exportCSV() {
      if (!currentData || currentData.length === 0) {
        alert('Tidak ada data untuk diexport!');
        return;
      }
      const mode = document.getElementById('mode-rekap').value;
      const bulan = document.getElementById('filter-bulan').value;
      let csvContent = "data:text/csv;charset=utf-8,";

      if (mode === 'ustadz') {
        csvContent += "No,Nama Ustadz,Hadir,Izin,Total Hari\n";
        currentData.forEach((u, i) => {
          csvContent += `${i + 1},"${u.username}",${u.hadir},${u.izin},${u.totalHari}\n`;
        });
      } else {
        csvContent += "No,Nama Santri,Hadir,Izin,Sakit,Alpa,Capaian Terakhir\n";
        currentData.forEach((s, i) => {
          csvContent += `${i + 1},"${s.nama}",${s.hadir},${s.izin},${s.sakit},${s.alpa},"${s.capaianTerakhir}"\n`;
        });
      }

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Rekap_TPA_${mode}_${bulan}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    initHalaqahOptions().then(loadRekapData);
  </script>
</body>

</html>
