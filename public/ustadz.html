<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ustadz - TPA Mutaba'ah</title>

    <!-- Favicon Ikon Tab Browser (Buku Saku Mutaba'ah) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/><path d='m9 10 2 2 4-4' stroke-width='2.5' stroke='%23059669'/></svg>">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 p-3 sm:p-4 max-w-md mx-auto min-h-screen pb-12 font-sans">

    <!-- Header Mobile dengan Logo Baru -->
    <header class="mb-4 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center shadow-md shadow-emerald-600/20 text-white shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    <path d="m9 10 2 2 4-4" stroke-width="2.5" class="stroke-emerald-200" />
                </svg>
            </div>
            <div>
                <h1 class="text-base font-bold text-slate-800 leading-tight">Dashboard Ustadz</h1>
                <p class="text-[11px] text-slate-500 font-medium" id="ustadz-name">Ustadz ...</p>
            </div>
        </div>
        <button onclick="logout()"
            class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold px-3 py-2 rounded-xl border border-rose-200 transition">
            Logout
        </button>
    </header>

    <!-- Navigasi Tab -->
    <div class="flex border-b border-slate-200 mb-4 gap-2">
        <button onclick="switchTab('input')" id="tab-input"
            class="py-2 px-3 text-xs font-bold border-b-2 border-emerald-600 text-emerald-700">Input Setoran</button>
        <button onclick="switchTab('riwayat')" id="tab-riwayat"
            class="py-2 px-3 text-xs font-medium text-slate-500 hover:text-slate-800">Riwayat Setoran</button>
        <button onclick="switchTab('presensi')" id="tab-presensi"
            class="py-2 px-3 text-xs font-medium text-slate-500 hover:text-slate-800">Presensi Saya</button>
    </div>

    <!-- TAB 1: INPUT SETORAN -->
    <section id="sec-input" class="space-y-3">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <input type="hidden" id="edit-mutabaah-id">
            <h3 id="form-title" class="text-xs font-bold text-slate-600 uppercase">Input Mutaba'ah Santri</h3>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Santri</label>
                <select id="select-santri"
                    class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
                    <option value="">-- Memuat Santri... --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Status Kehadiran</label>
                <select id="status-absen"
                    class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
                    <option value="hadir">Hadir</option>
                    <option value="izin">Izin</option>
                    <option value="sakit">Sakit</option>
                    <option value="alpa">Alpa</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Tipe Bacaan</label>
                <select id="tipe-bacaan"
                    class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
                    <option value="iqro">Iqro / Tilawati</option>
                    <option value="alquran">Al-Qur'an</option>
                    <option value="hafalan">Hafalan Surah</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Capaian / Halaman</label>
                <input type="text" id="capaian" placeholder="Contoh: Jilid 3 Hal 15"
                    class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Evaluasi / Catatan</label>
                <textarea id="evaluasi" rows="2" placeholder="Catatan kelancaran/tajwid..."
                    class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600"></textarea>
            </div>

            <div class="flex gap-2">
                <button onclick="simpanMutabaah()" id="btn-submit-mutabaah"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl text-xs shadow-sm transition">
                    Simpan Mutaba'ah
                </button>
                <button onclick="resetForm()" id="btn-cancel-mutabaah"
                    class="hidden w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-xl text-xs transition">
                    Batal
                </button>
            </div>
        </div>
    </section>

    <!-- TAB 2: RIWAYAT & KELOLA -->
    <section id="sec-riwayat" class="hidden space-y-3">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Filter Santri</label>
            <select id="filter-santri-riwayat" onchange="loadHistoryRiwayat()"
                class="w-full p-2.5 border rounded-xl text-xs bg-slate-50 focus:outline-emerald-600">
                <option value="">-- Memuat Santri... --</option>
            </select>
        </div>

        <div id="list-riwayat-container" class="space-y-3">
            <div class="bg-white p-6 rounded-2xl border text-center text-xs text-slate-400">
                Pilih santri untuk mengelola riwayat mutaba'ah.
            </div>
        </div>
    </section>

    <!-- TAB 3: PRESENSI SAYA -->
    <section id="sec-presensi" class="hidden space-y-3">
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <h3 class="text-xs font-bold text-slate-600 uppercase mb-3">Riwayat Kehadiran Mengajar</h3>
            <div id="list-presensi-ustadz" class="space-y-2">
                <p class="text-center text-xs py-4 text-slate-400">Memuat data presensi...</p>
            </div>
        </div>
    </section>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) window.location.href = '/login.html';
        else document.getElementById('ustadz-name').innerText = `Ustadz: ${user.username || '-'}`;

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

        function logout() { localStorage.clear(); window.location.href = '/login.html'; }

        function switchTab(tab) {
            ['input', 'riwayat', 'presensi'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = 'py-2 px-3 text-xs font-medium text-slate-500 hover:text-slate-800';
            });
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'py-2 px-3 text-xs font-bold border-b-2 border-emerald-600 text-emerald-700';

            if (tab === 'presensi') loadPresensiSaya();
        }

        async function loadPresensiSaya() {
            const container = document.getElementById('list-presensi-ustadz');
            container.innerHTML = '<p class="text-center text-xs py-4 text-slate-400">Memuat data...</p>';

            try {
                const res = await fetch(`/api/login/history/${user.id}`);
                const { data } = await res.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="text-center text-xs py-4 text-slate-400">Belum ada catatan presensi.</p>';
                    return;
                }

                container.innerHTML = '';
                data.forEach(item => {
                    const dateStr = new Date(item.tanggal).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
                    const isHadir = item.status === 'hadir';

                    container.innerHTML += `
                        <div class="flex justify-between items-center p-3 rounded-xl border border-slate-100 bg-slate-50 text-xs">
                        <div>
                            <p class="font-bold text-slate-700">${dateStr}</p>
                            ${item.keterangan ? `<p class="text-[11px] text-slate-500 italic">"${item.keterangan}"</p>` : ''}
                        </div>
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase ${isHadir ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                            ${item.status}
                        </span>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<p class="text-center text-xs py-4 text-rose-500">Gagal memuat presensi.</p>';
            }
        }

        let cacheHistory = [];

        async function initData() {
            const selInput = document.getElementById('select-santri');
            const selFilter = document.getElementById('filter-santri-riwayat');

            selInput.innerHTML = '<option value="">-- Memuat Santri... --</option>';
            selFilter.innerHTML = '<option value="">-- Memuat Santri... --</option>';

            try {
                // Fetch halaqah ustadz (termasuk badal jika ada ustadz lain izin)
                const resHalaqah = await fetch(`/api/halaqah?ustadzId=${user.id}`);
                const { data: listHalaqah } = await resHalaqah.json();

                if (!listHalaqah || listHalaqah.length === 0) {
                    selInput.innerHTML = '<option value="">-- Tidak ada halaqah --</option>';
                    selFilter.innerHTML = '<option value="">-- Tidak ada halaqah --</option>';
                    return;
                }

                let allowedSantri = [];
                for (const h of listHalaqah) {
                    const resSantri = await fetch(`/api/halaqah/${h.id}/santri`);
                    const { data: listSantri } = await resSantri.json();
                    if (listSantri) {
                        const santriWithLabel = listSantri.map(s => ({
                            ...s,
                            namaHalaqah: h.namaHalaqah,
                            isBadal: h.isBadal
                        }));
                        allowedSantri.push(...santriWithLabel);
                    }
                }

                selInput.innerHTML = '<option value="">-- Pilih Santri --</option>';
                selFilter.innerHTML = '<option value="">-- Pilih Santri --</option>';

                allowedSantri.forEach(s => {
                    const labelBadal = s.isBadal ? ' [BADAL]' : '';
                    const optionText = `${s.nama} (${s.namaHalaqah}${labelBadal})`;

                    selInput.innerHTML += `<option value="${s.id}">${optionText}</option>`;
                    selFilter.innerHTML += `<option value="${s.id}">${optionText}</option>`;
                });
            } catch (err) {
                console.error("Gagal memuat list santri", err);
                selInput.innerHTML = '<option value="">-- Gagal memuat data --</option>';
            }
        }

        async function simpanMutabaah() {
            const editId = document.getElementById('edit-mutabaah-id').value;
            const santriId = document.getElementById('select-santri').value;
            const statusAbsen = document.getElementById('status-absen').value;
            const tipeBacaan = document.getElementById('tipe-bacaan').value;
            const capaian = document.getElementById('capaian').value;
            const evaluasi = document.getElementById('evaluasi').value;

            if (!santriId) return alert('Pilih santri terlebih dahulu!');

            const url = editId ? `/api/mutabaah/${editId}` : '/api/mutabaah';
            const method = editId ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    santriId,
                    ustadzId: user.id,
                    tanggal: new Date().toISOString().slice(0, 10),
                    statusAbsen,
                    tipeBacaan,
                    capaian,
                    evaluasi
                })
            });

            const result = await res.json();
            if (result.success) {
                alert(editId ? 'Mutaba\'ah berhasil diperbarui!' : 'Mutaba\'ah berhasil disimpan!');
                resetForm();
                loadHistoryRiwayat();
            } else {
                alert(result.message || 'Gagal menyimpan.');
            }
        }

        async function loadHistoryRiwayat() {
            const santriId = document.getElementById('filter-santri-riwayat').value;
            const container = document.getElementById('list-riwayat-container');
            if (!santriId) return;

            container.innerHTML = '<p class="text-center text-xs py-4 text-slate-500">Memuat data...</p>';
            const res = await fetch(`/api/santri/${santriId}`);
            const result = await res.json();
            cacheHistory = result.history || result.data || [];

            if (cacheHistory.length === 0) {
                container.innerHTML = '<div class="bg-white p-4 rounded-2xl border text-center text-xs text-slate-400">Belum ada riwayat mutaba\'ah.</div>';
                return;
            }

            container.innerHTML = '';
            cacheHistory.forEach(item => {
                const dateStr = item.tanggal ? new Date(item.tanggal).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
                const status = item.statusAbsen || item.status || 'hadir';
                
                let jilidColor = 'bg-emerald-600';
                if (status === 'izin') jilidColor = 'bg-amber-500';
                else if (status === 'sakit') jilidColor = 'bg-blue-500';
                else if (status === 'alpa') jilidColor = 'bg-rose-500';

                container.innerHTML += `
                    <div class="relative bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden pl-4 pr-4 pt-3.5 pb-4 space-y-2">
                        <div class="absolute left-0 top-0 bottom-0 w-2.5 ${jilidColor}"></div>
                        <div class="flex justify-between items-center border-b border-dashed border-slate-200 pb-2">
                            <span class="text-xs font-bold text-slate-700">${dateStr} (${status.toUpperCase()})</span>
                            <div class="flex items-center gap-1.5">
                                <button onclick="editMutabaah(${item.id})" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-700 font-semibold px-2 py-1 rounded-lg border border-amber-200 transition">Edit</button>
                                <button onclick="deleteMutabaah(${item.id})" class="text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold px-2 py-1 rounded-lg border border-rose-200 transition">Hapus</button>
                            </div>
                        </div>
                        <div class="text-xs text-slate-600 space-y-1">
                            <p><span class="font-bold text-slate-800">Capaian:</span> ${item.capaian ? `${(item.tipeBacaan || '').toUpperCase()} - ${item.capaian}` : '-'}</p>
                            <p><span class="font-bold text-slate-800">Catatan:</span> "${item.catatan || item.evaluasi || '-'}"</p>
                        </div>
                    </div>
                `;
            });
        }

        function editMutabaah(id) {
            const item = cacheHistory.find(i => i.id === id);
            if (!item) return;

            switchTab('input');
            document.getElementById('edit-mutabaah-id').value = item.id;
            document.getElementById('select-santri').value = item.santriId;
            document.getElementById('status-absen').value = item.statusAbsen || item.status || 'hadir';
            document.getElementById('tipe-bacaan').value = item.tipeBacaan || 'iqro';
            document.getElementById('capaian').value = item.capaian || '';
            document.getElementById('evaluasi').value = item.catatan || item.evaluasi || '';

            document.getElementById('form-title').innerText = 'Edit Mutaba\'ah Santri';
            document.getElementById('btn-submit-mutabaah').innerText = 'Update Mutaba\'ah';
            document.getElementById('btn-cancel-mutabaah').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('edit-mutabaah-id').value = '';
            document.getElementById('capaian').value = '';
            document.getElementById('evaluasi').value = '';
            document.getElementById('form-title').innerText = 'Input Mutaba\'ah Santri';
            document.getElementById('btn-submit-mutabaah').innerText = 'Simpan Mutaba\'ah';
            document.getElementById('btn-cancel-mutabaah').classList.add('hidden');
        }

        async function deleteMutabaah(id) {
            if (confirm('Yakin ingin menghapus catatan mutaba\'ah ini?')) {
                await fetch(`/api/mutabaah/${id}`, { method: 'DELETE' });
                loadHistoryRiwayat();
            }
        }

        initData();
    </script>
</body>

</html>
